<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Digital - Café Bar Jhaque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-bar {
            background: linear-gradient(135deg, #212529, #343a40);
            color: white;
            padding: 2rem 1rem;
            border-bottom: 4px solid #00acc1;
            position: relative;
        }
        .header-center {
            text-align: center;
        }
        .login-btn-top {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 10;
        }
        @media (max-width: 767.98px) {
            .login-btn-top {
                position: static;
                display: inline-block;
                margin-bottom: 12px;
            }
        }
        .product-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
            background: white;
            overflow: hidden;
            height: 100%;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .product-img {
            height: 160px;
            object-fit: cover;
            width: 100%;
        }
        .price-tag {
            color: #00acc1;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .category-title {
            border-left: 4px solid #00acc1;
            padding-left: 10px;
            margin: 2rem 0 1rem 0;
            color: #343a40;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="container position-relative">
            <div class="login-btn-top">
                <a href="http://127.0.0.1:5000/login" class="btn btn-outline-info btn-sm fw-semibold">
                    <i class="fas fa-user-lock me-1"></i>Iniciar sesión
                </a>
            </div>
            <div class="header-center">
                <h1><i class="fas fa-utensils me-2"></i>Café Bar Jhaque</h1>
                <p class="text-muted mb-0" style="color: #adb5bd !important;">Consulta nuestra carta en tiempo real</p>
            </div>
        </div>
    </div>

    <div class="container my-4" id="contenedor-carta">
        <p class="text-center text-muted">Cargando carta...</p>
    </div>

    <footer class="text-center py-4 text-muted bg-white border-top mt-5">
        <p class="mb-0">&copy; 2026 Café Bar Jhaque - Todos los derechos reservados.</p>
    </footer>

    <script>
        fetch("menu.json")
            .then(res => res.json())
            .then(productos => {
                const contenedor = document.getElementById("contenedor-carta");
                if (!Array.isArray(productos) || productos.length === 0) {
                    contenedor.innerHTML = "<p class='text-center text-muted'>No hay productos disponibles hoy.</p>";
                    return;
                }

                const categorias = {};
                productos.forEach(p => {
                    const cat = p.categoria || "General";
                    if (!categorias[cat]) categorias[cat] = [];
                    categorias[cat].push(p);
                });

                let html = "";
                Object.keys(categorias).forEach(cat => {
                    html += `<h3 class="category-title">${cat}</h3>`;
                    html += `<div class="row row-cols-1 row-cols-md-3 g-4">`;
                    categorias[cat].forEach(p => {
                        let imgSrc = p.imagen || "https://cdn-icons-png.flaticon.com/512/2738/2738730.png";
                        if (imgSrc.startsWith("/")) {
                            imgSrc = imgSrc.substring(1); // convierte "/static/uploads/..." en "static/uploads/..."
                        }
                        const precioNum = Number(p.precio || 0).toFixed(2);
                        html += `
                            <div class="col">
                                <div class="product-card card">
                                    <img src="${imgSrc}" class="product-img" alt="${p.nombre}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2738/2738730.png'">
                                    <div class="card-body d-flex flex-column justify-content-between">
                                        <div>
                                            <h5 class="card-title text-dark fw-bold">${p.nombre}</h5>
                                        </div>
                                        <div class="d-flex justify-content-between align-items-center mt-3">
                                            <span class="price-tag">${precioNum} €</span>
                                            <span class="badge bg-success">Disponible</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                });

                contenedor.innerHTML = html;
            })
            .catch(() => {
                document.getElementById("contenedor-carta").innerHTML = "<p class='text-center text-danger'>No se pudo cargar la carta.</p>";
            });
    </script>

</body>
</html>
